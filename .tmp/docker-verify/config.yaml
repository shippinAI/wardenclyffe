server:
  listenAddress: ":33073"
  exposedAddress: "http://127.0.0.1:33073"
  metricsPort: 9090
  healthcheckAddress: ":9000"
  logLevel: "info"
  logFile: "console"
  authSecret: "docker-verify-secret"
  dataDir: "/var/lib/wardenclyffe"
  tls:
    certFile: ""
    keyFile: ""
    letsencrypt:
      enabled: false
      dataDir: ""
      domains: []
      email: ""
      awsRoute53: false
  auth:
    issuer: "http://127.0.0.1:33073/oauth2"
    localAuthDisabled: false
    signKeyRefreshEnabled: false
    dashboardRedirectURIs:
      - "http://localhost/nb-auth"
    cliRedirectURIs:
      - "http://localhost:53000/"
  store:
    engine: "sqlite"
    encryptionKey: ""
  stunPorts: []